[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/authz",
    "crates/access",
    "crates/authz-casbin",
    "crates/identity",
    "crates/authn",
    "crates/saas",
    "crates/db",
    "crates/seed",
    "crates/audit",
    "crates/audit-pg",
    "crates/rate-limiter",
    "crates/rust-saas",
]
exclude = ["examples/*"]

[workspace.package]
publish = false
license = "MIT"
version = "0.2.2"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4", "js"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
casbin = { version = "2", default-features = false, features = ["runtime-tokio"] }
sqlx-adapter = "1"
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = "9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
sha2 = "0.10"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }