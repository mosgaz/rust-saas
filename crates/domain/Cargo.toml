[package]
name = "domain"
version = "0.1.0"
edition = "2021"
description = "Shared business types and authorization domain name helpers"

[dependencies]
serde.workspace = true
uuid.workspace = true
chrono.workspace = true
sqlx = { workspace = true, optional = true }

[features]
ssr = ["dep:sqlx"]
# Test-only helpers (`AuthUser::test_verified` / `AuthUser::test_unverified`).
# Enabled exclusively from `[dev-dependencies]` of crates with tests; never
# part of a production build.
test-support = []