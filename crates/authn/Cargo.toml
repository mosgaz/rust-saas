[package]
name = "authn"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Authentication: Argon2, JWT access tokens, opaque refresh tokens with rotation and family revocation"

[dependencies]
identity = { path = "../identity" }
domain = { path = "../domain" }
audit = { path = "../audit" }

sqlx.workspace = true
argon2.workspace = true
jsonwebtoken.workspace = true
serde.workspace = true
serde_json = "1"
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
# SHA-256 for `refresh_tokens.token_hash` (Stage 2b). Not used for passwords
# (passwords are Argon2, see `hash_password`).
sha2.workspace = true
# Random number generation for TOTP and recovery codes
rand = "0.8"
# SHA-1 for TOTP implementation
sha-1 = "0.10"
# HMAC for TOTP implementation
hmac = "0.12"
# Base32 encoding for TOTP secret
base32 = "0.4"

[dev-dependencies]
tokio.workspace = true
# `macros` enables `#[sqlx::test]`; the macro reads `.env` on its own via the
# built-in `dotenvy` in `sqlx-macros`, so no separate feature is needed.
sqlx = { workspace = true, features = ["macros"] }
audit-pg = { path = "../audit-pg" }