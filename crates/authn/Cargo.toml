[package]
name = "authn"
version = "0.1.0"
edition = "2021"
description = "Аутентификация: Argon2, JWT, register/login/verify_token"

[dependencies]
identity = { path = "../identity" }
domain = { path = "../domain" }

sqlx.workspace = true
argon2.workspace = true
jsonwebtoken.workspace = true
serde.workspace = true
serde_json = "1"
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio.workspace = true
# `macros` нужен для `#[sqlx::test]`; `.env` макрос читает сам через внутренний `dotenvy`,
# отдельной feature для этого нет.
sqlx = { workspace = true, features = ["macros"] }