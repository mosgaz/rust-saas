[package]
name = "authz"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Authorization abstraction: the AuthorizationEngine trait and error types"

[dependencies]
uuid.workspace = true
thiserror.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json = "1"

[features]
# Test-only `AllowAllAuthz` / `DenyAllAuthz` (Stage 4.3a).
# Enabled from `[dev-dependencies]` of crates whose tests do not need a
# real Casbin backend. Never enabled from a production build.
test-support = []

[dev-dependencies]
tokio.workspace = true
