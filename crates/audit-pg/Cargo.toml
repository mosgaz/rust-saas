[package]
name = "audit-pg"
version = "0.1.0"
edition = "2021"
description = "PostgreSQL implementation of the audit::AuditLogger trait (audit_log table)"

[dependencies]
audit = { path = "../audit" }

sqlx.workspace = true
uuid.workspace = true
thiserror.workspace = true
async-trait.workspace = true

[dev-dependencies]
tokio.workspace = true
chrono.workspace = true
serde_json = "1"
sqlx = { workspace = true, features = ["macros"] }