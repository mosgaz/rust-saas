services:
  postgres:
    image: postgres:16-alpine
    container_name: rust-saas-postgres-core
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rust_saas}
    ports:
      - "5430:5432"
    volumes:
      - rust_saas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rust_saas}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rust_saas_net

volumes:
  rust_saas_pg_data:

networks:
  rust_saas_net: