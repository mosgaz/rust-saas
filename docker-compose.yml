services:
  postgres:
    image: postgres:16-alpine
    container_name: rust-saas-postgres-core
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rust_saas}
    ports:
      - "5430:5432"
    volumes:
      - rust_saas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rust_saas}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rust_saas_net

  # Stage 3b: Mailpit — local SMTP server + web UI for inspecting emails.
  # Used by `examples/saas-leptos` (`SmtpEmailSender`) when `SMTP_URL` is set
  # to `smtp://localhost:1025`. Open http://localhost:8025 to read messages.
  # No volume: the inbox is dev-only and may be discarded on `down`.
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: rust-saas-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP — lettre (SmtpEmailSender) connects here
      - "8025:8025"   # Web UI — http://localhost:8025
    environment:
      # Dev-only: raise if you hit the default cap during a demo.
      MP_MAX_MESSAGES: 5000
    networks:
      - rust_saas_net

volumes:
  rust_saas_pg_data:

networks:
  rust_saas_net: