[package]
name = "minimal-lms"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
rust-saas = { path = "../../crates/rust-saas", features = ["axum"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate"] }
anyhow = "1"
dotenvy = "0.15"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
sqlx = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"

[workspace]
