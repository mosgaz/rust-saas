[package]
name = "saas-leptos"
version = "0.1.0"
edition = "2021"
description = "Leptos SSR reference consumer of the rust-saas library"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
domain = { path = "../../crates/domain", default-features = false }
authz = { path = "../../crates/authz", optional = true }
authz-casbin = { path = "../../crates/authz-casbin", optional = true }
access = { path = "../../crates/access", optional = true }
identity = { path = "../../crates/identity", optional = true }
authn = { path = "../../crates/authn", optional = true }
saas = { path = "../../crates/saas", optional = true }
db = { path = "../../crates/db", optional = true }
audit = { path = "../../crates/audit", optional = true }
audit-pg = { path = "../../crates/audit-pg", optional = true }

leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_axum = { version = "0.8", optional = true }

axum = { version = "0.8", optional = true }
axum-extra = { version = "0.10", features = ["cookie"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"], optional = true }
tower-http = { version = "0.6", features = ["fs", "trace"], optional = true }
# Stage 3b: SMTP delivery for email-verification links.
# - `tokio1-rustls` — async TLS через rustls (новая фича, без суффикса `-tls`).
# - `ring` + `webpki-roots` — криптопровайдер и корневые сертификаты;
#   новые фичи lettre 0.11.14+ не включают их автоматически.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1",
    "builder",
    "tokio1-rustls",
    "ring",
    "webpki-roots",
], optional = true }
async-trait = { version = "0.1", optional = true }

serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v4", "js"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
dotenvy = { version = "0.15", optional = true }
icons = { version = "0.19", features = ["leptos"] }
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

[features]
hydrate = [
    "leptos/hydrate",
]
ssr = [
    "dep:authz",
    "dep:authz-casbin",
    "dep:access",
    "dep:identity",
    "dep:authn",
    "dep:saas",
    "dep:db",
    "dep:audit",
    "dep:audit-pg",
    "dep:axum",
    "dep:axum-extra",
    "dep:tokio",
    "dep:sqlx",
    "dep:leptos_axum",
    "dep:tower-http",
    "dep:tracing-subscriber",
    "dep:dotenvy",
    "dep:lettre",
    "dep:async-trait",
    "domain/ssr",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[package.metadata.leptos]
output-name = "rust-saas-leptos"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "assets/styles/tailwind.css"
assets-dir = "public"
site-addr = "127.0.0.1:3395"
reload-port = 3396
bin-features = ["ssr"]
lib-features = ["hydrate"]

# Independent workspace: consumer example, not part of the library.
[workspace]