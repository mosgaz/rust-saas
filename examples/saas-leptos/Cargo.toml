[package]
name = "saas-leptos"
version = "0.1.0"
edition = "2021"
description = "Leptos SSR reference consumer of the rust-saas library"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
domain = { path = "../../crates/domain", default-features = false }
rust-saas = { path = "../../crates/rust-saas", features = ["ssr", "rate-limiter-redis"], optional = true }

leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_axum = { version = "0.8", optional = true }

axum = { version = "0.8", optional = true }
axum-extra = { version = "0.10", features = ["cookie"], optional = true }
# Stage 4.1b: `cookie::time::Duration` for `Cookie::max_age`.
cookie = { version = "0.18", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"], optional = true }
tower-http = { version = "0.6", features = ["fs", "trace"], optional = true }
# Stage 3b: SMTP delivery for email-verification links.
# - `tokio1-rustls` — async TLS через rustls (новая фича, без суффикса `-tls`).
# - `ring` + `webpki-roots` — криптопровайдер и корневые сертификаты;
#   новые фичи lettre 0.11.14+ не включают их автоматически.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "tokio1",
    "builder",
    "tokio1-rustls",
    "ring",
    "webpki-roots",
], optional = true }
async-trait = { version = "0.1", optional = true }
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.16", default-features = false, optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "js"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
dotenvy = { version = "0.15", optional = true }
icons = { version = "0.19", features = ["leptos"] }
wasm-bindgen = "=0.2.129"
web-time = "1.1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

[features]
hydrate = [
    "leptos/hydrate",
]
ssr = [
"dep:rust-saas",
    "dep:axum",
    "dep:axum-extra",
    "dep:cookie",
    "dep:tokio",
    "dep:sqlx",
    "dep:leptos_axum",
    "dep:tower-http",
    "dep:tracing-subscriber",
    "dep:dotenvy",
    "dep:lettre",
    "dep:async-trait",
    "dep:metrics",
    "dep:metrics-exporter-prometheus",
    "domain/ssr",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[package.metadata.leptos]
output-name = "rust-saas-leptos"
site-root = "target/site"
site-pkg-dir = "pkg"
tailwind-input-file = "assets/styles/tailwind.css"
assets-dir = "public"
site-addr = "127.0.0.1:3395"
reload-port = 3396
bin-features = ["ssr"]
lib-features = ["hydrate"]
lib-profile-release = "wasm-release"
wasm-opt-features = ["-Oz"]

# Independent workspace: consumer example, not part of the library.

[profile.wasm-release]
inherits = "release"
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1

[workspace]

[dev-dependencies]
# Stage 4.7: `#[sqlx::test]` for isolated per-test DBs.
# `tokio` is already in [dependencies] as optional (ssr); pull the macro
# runtime explicitly so `#[tokio::test]` works in tests.
sqlx = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full", "macros"] }
# Stage 4.7: `tower::ServiceExt::oneshot` for in-process router calls.
tower = { version = "0.5", features = ["util"] }
# Stage 4.7: read `Response` body as bytes.
http-body-util = "0.1"

[[test]]
name = "e2e"
# All server modules (`state`, `extract`, `middleware`, `auth`, …) are
# `#[cfg(feature = "ssr")]`; the test target needs the SSR build.
required-features = ["ssr"]
