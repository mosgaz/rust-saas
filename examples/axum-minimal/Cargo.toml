[package]
name = "axum-minimal"
version = "0.1.0"
edition = "2021"
description = "Minimal Axum consumer of rust-saas, fork-free on saas-axum (Stage 5.0-A6)"

[lib]
crate-type = ["rlib"]

[dependencies]
# One workspace dependency: every rust-saas crate (domain, authz, access,
# authn, saas, db, audit, audit-pg, rate-limiter, saas-axum) is
# re-exported under rust_saas::* behind the axum feature.
rust-saas = { path = "../../crates/rust-saas", features = ["axum"] }

# System crates (public registries).
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate"] }
anyhow = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
# sqlx::test for isolated per-test DBs.
sqlx = { version = "0.8", features = ["macros"] }
# tower::ServiceExt::oneshot for in-process router calls.
tower = { version = "0.5", features = ["util"] }
# Read Response body as bytes (JSON assertions).
http-body-util = "0.1"
serde_json = "1"
# /metrics test only: install a Prometheus recorder via
# metrics-exporter-prometheus, wire it through
# AxumAppStateBuilder::with_prometheus. The production binary does not
# install Prometheus (matches examples/minimal-lms); enable it in a
# deployment by adding metrics-exporter-prometheus to [dependencies] and
# calling .with_prometheus(handle) in main.rs.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

# Independent workspace: second consumer example, not part of the library.
[workspace]
