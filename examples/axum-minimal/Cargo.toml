[package]
name = "axum-minimal"
version = "0.1.0"
edition = "2021"
description = "Minimal Axum consumer of the rust-saas library (portability proof, Stage 3g)"

[lib]
# Stage 4.7: expose `build_app` to `tests/e2e.rs`. `rlib` only —
# `axum-minimal` has no wasm/cdylib target.
crate-type = ["rlib"]

[dependencies]
# Library crates — same public contracts as `saas-leptos`; `crates/*` untouched.
# `domain` is built with the `ssr` feature so its `sqlx::FromRow` / `sqlx::Type`
# derives are available to the Axum handlers (same as `saas-leptos`).
domain = { path = "../../crates/domain", features = ["ssr"] }
authz = { path = "../../crates/authz" }
authz-casbin = { path = "../../crates/authz-casbin" }
access = { path = "../../crates/access" }
identity = { path = "../../crates/identity" }
authn = { path = "../../crates/authn" }
saas = { path = "../../crates/saas" }
db = { path = "../../crates/db" }
audit = { path = "../../crates/audit" }
audit-pg = { path = "../../crates/audit-pg" }

# Axum stack (no Leptos).
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
# Stage 4.1b: `cookie::time::Duration` for `Cookie::max_age`.
cookie = "0.18"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
tower-http = { version = "0.6", features = ["trace"] }

# Shared utilities.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

# Independent workspace: second consumer example, not part of the library.
[workspace]
[dev-dependencies]
# Stage 4.7: `#[sqlx::test]` for isolated per-test DBs.
sqlx = { version = "0.8", features = ["macros"] }
# Stage 4.7: `tower::ServiceExt::oneshot` for in-process router calls.
tower = { version = "0.5", features = ["util"] }
# Stage 4.7: read `Response` body as bytes (JSON assertions).
http-body-util = "0.1"
