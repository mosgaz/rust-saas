[workspace]

[package]
name = "minimal-lms-abac"
version = "0.4.0"
edition = "2021"
publish = false
description = "Fork-free Axum consumer demonstrating ABAC on Casbin (Phase B' DoD artifact)"

[dependencies]
rust-saas = { path = "../../crates/rust-saas", features = ["axum"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate"] }
anyhow = "1"
dotenvy = "0.15"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"

[[test]]
name = "e2e"
path = "tests/e2e.rs"
