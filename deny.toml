[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "wasm32-unknown-unknown" },
]
all-features = true

[advisories]
version = 2
ignore = ["RUSTSEC-2026-0249"]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

# Frontend (examples only).
[[bans.deny]]
name = "leptos"

[[bans.deny]]
name = "leptos_axum"

[[bans.deny]]
name = "leptos_router"

[[bans.deny]]
name = "leptos_meta"

# HTTP: `saas-axum` (internal HTTP adapter; consumer-facing via `rust-saas::features = ["axum"]`).
# `examples/*` are in `workspace.exclude` — `cargo deny` does not see them.
[[bans.deny]]
# Direct parents: `saas-axum` (the adapter), `axum-extra` (which itself
# depends on `axum`), and `rust-saas` (dev-dep on `axum` for the
# compile-only `feature_axum.rs` test).
name = "axum"
wrappers = ["axum-extra", "saas-axum", "rust-saas"]

[[bans.deny]]
name = "axum-extra"
wrappers = ["saas-axum"]

[[bans.deny]]
name = "tower-http"
wrappers = ["saas-axum"]

[[bans.deny]]
name = "matchit"
# Directly by `saas-axum` (`RouteBindings::resolve`); transitively by `axum`.
wrappers = ["saas-axum", "axum"]

[[bans.deny]]
# Direct parents: `axum` (which itself is wrapped via `saas-axum` /
# `axum-extra` / `rust-saas`) and `hyper-util` (transitive through
# `axum`). `saas-axum` reaches `hyper` only via `axum`.
name = "hyper"
wrappers = ["axum", "hyper-util"]

[[bans.deny]]
name = "reqwest"

# SMTP: `saas-leptos` only (`SmtpEmailSender`).
[[bans.deny]]
# `saas-leptos` (SMTP) is under `examples/*` (`workspace.exclude`), so
# `cargo deny` never sees it. Bare ban keeps `lettre` out of any workspace
# crate; the example uses its own dep graph.
name = "lettre"

# Casbin — only authz-casbin and sqlx-adapter.
[[bans.deny]]
name = "casbin"
wrappers = ["authz-casbin", "sqlx-adapter"]

[[bans.deny]]
name = "sqlx-adapter"
wrappers = ["authz-casbin"]

# JWT + Argon2 — only authn.
[[bans.deny]]
name = "jsonwebtoken"
wrappers = ["authn"]

[[bans.deny]]
name = "argon2"
wrappers = ["authn"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
